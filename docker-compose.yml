services:
  database-agent:
    build:
      context: .
      dockerfile: Dockerfile
    # Keep container running so you can open multiple exec sessions for concurrency testing.
    command: ["sh", "-lc", "sleep infinity"]
    tty: true
    stdin_open: true
    environment:
      # LLM provider (if you keep apiKey in config.json, this is optional)
      - DEEPSEEK_API_KEY=sk-78fb9614e31a405e9045d805136ae729
      # Database settings (also overridden by tools.mcpServers.database.env in config.json)
      - DB_PATH=/app/data/business.db
      - DB_READONLY=true
      - QUERY_TIMEOUT=30
      - MAX_ROWS=1000
      - MAX_CONCURRENT=5
      - AUDIT_LOG_PATH=/app/reports/audit.log
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./reports:/app/reports
